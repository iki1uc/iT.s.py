:root{
  --bg:#070502;
  --surface:#100c06;
  --surface-2:#171106;
  --line:#3a2d14;
  --line-2:#6a511e;
  --gold:#e2b94e;
  --gold-2:#f4d67f;
  --cream:#f2e7c8;
  --muted:#a9986f;
  --dim:#6f613f;
  --green:#8fc47a;
}

*{
  box-sizing:border-box
}

html{
  background:var(--bg);
  color:var(--cream)
}

body{
  margin:0;
  background:var(--bg);
  color:var(--cream);
  font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace
}

button{
  font:inherit
}

.shell{
  min-height:100vh;
  background:radial-gradient(circle at 78% 4%,rgba(226,185,78,.16),transparent 34%),var(--bg);
  padding:var(--safe-area-inset-top) 0 0;
  overflow-x:clip
}

.top{
  max-width:1440px;
  margin:0 auto;
  padding:28px 28px 30px;
  border-bottom:1px solid var(--line)
}

.top-line{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  color:var(--gold);
  font-size:11px;
  letter-spacing:.18em
}

.eyebrow{
  display:flex;
  align-items:center;
  gap:8px
}

.dot{
  width:8px;
  height:8px;
  background:var(--gold);
  border-radius:50%;
  box-shadow:0 0 12px var(--gold)
}

.series{
  color:var(--muted)
}

.hero-grid{
  display:grid;
  grid-template-columns:1.05fr .9fr 1.05fr;
  gap:0;
  margin-top:34px;
  border:1px solid var(--line);
  background:var(--surface)
}

.hero-copy{
  padding:28px;
  border-right:1px solid var(--line)
}

.kicker{
  font-size:11px;
  letter-spacing:.18em;
  color:var(--gold);
  margin-bottom:24px
}

h1{
  font-size:clamp(44px,5.2vw,76px);
  line-height:.82;
  letter-spacing:-.06em;
  margin:0;
  text-transform:uppercase
}

h1 span{
  color:var(--gold);
  font-weight:400
}

.lede{
  margin:28px 0 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.7
}

.instrument{
  padding:22px;
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column
}

.instrument-head{
  display:flex;
  justify-content:space-between;
  color:var(--gold);
  font-size:10px;
  letter-spacing:.12em
}

.instrument-head span{
  display:flex;
  align-items:center;
  gap:5px
}

.live{
  color:var(--green)
}

.dial{
  width:210px;
  height:210px;
  margin:24px auto 14px;
  position:relative;
  border:1px solid var(--line-2);
  border-radius:50%;
  overflow:hidden
}

.ring{
  position:absolute;
  border:1px solid rgba(226,185,78,.25);
  border-radius:50%;
  inset:0;
  margin:auto
}

.ring-1{
  width:150px;
  height:150px
}

.ring-2{
  width:92px;
  height:92px
}

.ring-3{
  width:38px;
  height:38px
}

.sweep{
  position:absolute;
  inset:0;
  background:conic-gradient(from 0deg,rgba(226,185,78,.35),transparent 70deg);
  animation:sweep 4s linear infinite
}

@keyframes sweep{
  to{
    transform:rotate(360deg)
  }
}

.orbit{
  position:absolute;
  border:1px dashed rgba(242,231,200,.25);
  border-radius:50%;
  inset:0;
  margin:auto
}

.orbit-a{
  width:176px;
  height:176px
}

.orbit-b{
  width:124px;
  height:124px
}

.orbit i{
  position:absolute;
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--gold-2);
  box-shadow:0 0 10px var(--gold);
  top:-3px;
  left:50%
}

.orbit-a i{
  animation:orbit 7s linear infinite
}

.orbit-b i{
  animation:orbit 5s linear infinite reverse
}

@keyframes orbit{
  to{
    transform:rotate(360deg);
    transform-origin:0 91px
  }
}

.center{
  position:absolute;
  inset:0;
  margin:auto;
  width:78px;
  height:78px;
  border:1px solid var(--gold);
  border-radius:50%;
  background:#070502;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:2
}

.center strong{
  font-size:29px;
  color:var(--gold-2)
}

.center small{
  font-size:8px;
  letter-spacing:.2em;
  color:var(--muted)
}

.dial-label{
  position:absolute;
  font-size:8px;
  letter-spacing:.14em;
  color:var(--muted);
  z-index:2
}

.tl{
  left:13px;
  top:18px
}

.br{
  right:17px;
  bottom:16px
}

.roller{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-top:1px solid var(--line);
  padding-top:14px;
  font-size:11px
}

.roller strong{
  color:var(--gold-2);
  font-size:16px
}

.roller-next{
  color:var(--dim)
}

.mirror-panel{
  padding:26px
}

.mirror-title{
  display:flex;
  gap:8px;
  align-items:center;
  color:var(--gold);
  font-size:11px;
  letter-spacing:.1em;
  line-height:1.4
}

.view-switch{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border:1px solid var(--line-2);
  margin:20px 0
}

.view-switch button{
  border:0;
  border-right:1px solid var(--line);
  background:transparent;
  color:var(--muted);
  padding:11px 5px;
  cursor:pointer
}

.view-switch button:last-child{
  border-right:0
}

.view-switch button.active{
  background:var(--gold);
  color:#171106;
  font-weight:800
}

.split-view{
  display:grid;
  grid-template-columns:1fr 30px 1fr;
  min-height:130px
}

.split-view>div{
  padding:12px 0
}

.split-view small{
  display:block;
  color:var(--dim);
  font-size:9px;
  letter-spacing:.14em
}

.split-view strong{
  font-size:18px
}

.split-view p{
  color:var(--muted);
  font-size:12px;
  line-height:1.6
}

.split-divider{
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--gold)
}

.dim{
  opacity:.3
}

.mirror-note{
  border-top:1px solid var(--line);
  padding-top:14px;
  color:var(--cream);
  font-size:12px;
  line-height:1.6
}

main{
  max-width:1440px;
  margin:0 auto;
  padding:0 28px
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:24px;
  padding:52px 0 22px
}

.section-no{
  color:var(--gold);
  font-size:11px;
  letter-spacing:.16em;
  margin:0 0 12px
}

.section-head h2,.exam-head h2{
  font-size:clamp(32px,4vw,54px);
  line-height:.9;
  letter-spacing:-.04em;
  margin:0;
  text-transform:uppercase
}

.section-note{
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
  text-align:right
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border:1px solid var(--line)
}

.card{
  background:var(--surface);
  border-right:1px solid var(--line);
  padding:22px;
  transition:.2s
}

.card:last-child{
  border-right:0
}

.card.is-selected{
  background:var(--surface-2);
  box-shadow:inset 0 0 0 1px var(--gold)
}

.card.is-over{
  transform:translateY(-3px)
}

.card-hit{
  display:block;
  width:100%;
  text-align:left;
  background:transparent;
  border:0;
  color:inherit;
  padding:0;
  cursor:pointer
}

.card-top{
  display:flex;
  justify-content:space-between;
  color:var(--gold);
  font-size:10px;
  letter-spacing:.12em
}

.card-file{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:11px;
  margin:26px 0 10px;
  word-break:break-all
}

.card h3{
  font-size:30px;
  line-height:1;
  margin:0;
  text-transform:uppercase
}

.card-label{
  display:block;
  color:var(--gold);
  font-size:11px;
  margin-top:10px
}

.card-body{
  border-top:1px solid var(--line);
  padding-top:16px;
  min-height:264px
}

.card-body>p{
  font-size:12px;
  line-height:1.6;
  margin:0 0 6px
}

.formula{
  display:flex;
  flex-direction:column;
  gap:5px;
  margin:16px 0
}

.formula span{
  background:rgba(226,185,78,.08);
  border-left:2px solid var(--gold);
  padding:8px 10px;
  font-size:11px
}

.roots{
  color:var(--cream)!important
}

.geo{
  color:var(--gold)!important
}

.status{
  color:var(--green)!important;
  font-weight:700
}

.verdict{
  border-top:1px solid var(--line);
  padding-top:14px;
  font-size:12px;
  line-height:1.65;
  color:var(--muted);
  min-height:66px
}

.choose{
  font-size:10px;
  letter-spacing:.1em;
  color:var(--gold)
}

.flight-strip{
  display:flex;
  align-items:center;
  gap:20px;
  border:1px solid var(--line);
  border-top:0;
  padding:14px 18px;
  background:#090704;
  font-size:11px;
  line-height:1.5
}

.flight-strip>span:first-child{
  color:var(--gold);
  letter-spacing:.15em
}

.flight-strip strong{
  color:var(--cream)
}

.flight-strip span:last-child{
  color:var(--muted)
}

.exam{
  border:1px solid var(--line);
  margin-top:58px;
  background:var(--surface)
}

.exam-head{
  display:flex;
  justify-content:space-between;
  gap:24px;
  padding:30px
}

.stamp{
  border:1px solid var(--gold);
  color:var(--gold-2);
  padding:13px;
  font-size:11px;
  line-height:1.7;
  text-align:right;
  align-self:start
}

.exam-grid{
  display:grid;
  grid-template-columns:1.15fr .85fr;
  border-top:1px solid var(--line)
}

.exam-main{
  padding:30px;
  border-right:1px solid var(--line)
}

.big-q{
  font-size:13px;
  color:var(--muted);
  margin:0
}

.big-a{
  font-size:82px;
  line-height:1;
  color:var(--gold);
  margin:8px 0 20px
}

.exam-main p{
  line-height:1.7;
  font-size:13px
}

.exam-main code{
  color:var(--gold-2);
  background:#070502;
  padding:3px 6px
}

.muted{
  color:var(--muted)
}

.modules{
  padding:30px
}

.module-head{
  display:flex;
  justify-content:space-between;
  color:var(--gold);
  font-size:10px;
  letter-spacing:.14em;
  margin-bottom:15px
}

.module{
  display:flex;
  justify-content:space-between;
  gap:10px;
  border-bottom:1px dashed var(--line);
  padding:11px 0;
  font-size:12px
}

.module b{
  color:var(--gold)
}

.modules>p{
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
  margin:16px 0 0
}

.enter-zone{
  margin-top:58px
}

.enter-copy{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:20px;
  margin-bottom:16px
}

.enter-copy h2{
  font-size:clamp(36px,5vw,62px);
  margin:0;
  line-height:.9
}

.enter-copy p{
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
  text-align:right
}

.enter-bar{
  width:100%;
  display:grid;
  grid-template-columns:1.1fr 1.7fr .8fr .8fr 1.1fr;
  border:1px solid var(--gold);
  background:#171106;
  color:var(--cream);
  padding:18px;
  cursor:pointer;
  text-align:left
}

.enter-bar span{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:12px
}

.enter-bar b{
  color:var(--gold-2);
  font-size:16px
}

.enter-bar small{
  font-size:9px;
  color:var(--muted)
}

.enter-action{
  justify-content:flex-end;
  color:var(--gold);
  font-weight:800
}

.enter-bar.entered{
  background:var(--gold);
  color:#171106
}

.enter-bar.entered b,.enter-bar.entered .enter-action{
  color:#171106
}

.enter-confirm{
  margin:12px 0 0;
  color:var(--green);
  font-size:12px
}

.history{
  display:flex;
  align-items:center;
  gap:14px;
  border:1px solid var(--line);
  margin-top:24px;
  padding:16px 18px;
  background:var(--surface);
  color:var(--muted);
  font-size:12px
}

.history strong{
  color:var(--cream)
}

.history svg:last-child{
  margin-left:auto;
  color:var(--gold)
}

footer{
  max-width:1440px;
  margin:64px auto 0;
  padding:26px 28px 34px;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:center;
  color:var(--muted);
  font-size:11px;
  line-height:1.6
}

footer div{
  display:flex;
  gap:12px
}

footer strong{
  color:var(--cream)
}

footer b{
  color:var(--gold)
}

@media(max-width:900px){
  .hero-grid{
    grid-template-columns:1fr 1fr
  }

  .hero-copy{
    grid-column:1/-1;
    border-right:0;
    border-bottom:1px solid var(--line)
  }

  .mirror-panel{
    grid-column:1/-1;
    border-top:1px solid var(--line)
  }

  .cards{
    grid-template-columns:1fr
  }

  .card{
    border-right:0;
    border-bottom:1px solid var(--line)
  }

  .card:last-child{
    border-bottom:0
  }

  .card-body{
    min-height:0
  }

  .exam-grid{
    grid-template-columns:1fr
  }

  .exam-main{
    border-right:0;
    border-bottom:1px solid var(--line)
  }

  .enter-bar{
    grid-template-columns:1fr 1fr;
    gap:16px
  }

  .flight-strip{
    flex-direction:column;
    align-items:flex-start;
    gap:4px
  }

  .section-head,.exam-head,.enter-copy{
    flex-direction:column;
    align-items:flex-start
  }

  .section-note,.enter-copy p{
    text-align:left
  }

  .stamp{
    text-align:left
  }
}

@media(max-width:560px){
  .top,.mirror-panel{
    padding-left:16px;
    padding-right:16px
  }

  .top{
    padding-top:18px
  }

  main{
    padding:0 16px
  }

  .hero-grid{
    grid-template-columns:1fr
  }

  .instrument{
    border-right:0;
    border-bottom:1px solid var(--line)
  }

  .enter-bar{
    grid-template-columns:1fr
  }

  .enter-action{
    justify-content:flex-start
  }

  footer{
    flex-direction:column;
    align-items:flex-start;
    padding-left:16px;
    padding-right:16px
  }

  .top-line{
    align-items:flex-start
  }

  .series{
    display:none
  }

  .dial{
    width:190px;
    height:190px
  }
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#070502;
    --surface:#100c06
  }
}
