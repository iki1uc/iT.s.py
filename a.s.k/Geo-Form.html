:root{
  --bg:#0a0906;
  --surface:#12100a;
  --surface2:#18150d;
  --line:#2b2517;
  --line2:#3d341f;
  --gold:#e6c25a;
  --gold2:#b9972f;
  --ink:#f2ecd9;
  --muted:#a99f86;
  --muted2:#6d6651;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0a0906;
    --surface:#12100a;
    --ink:#f2ecd9;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace
}

a{
  color:inherit;
  text-decoration:none
}

button{
  font:inherit
}

.shell{
  min-height:100vh;
  background:var(--bg);
  padding:var(--safe-area-inset-top) 0 0;
  overflow-x:clip
}

.topbar{
  position:sticky;
  top:var(--safe-area-inset-top);
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  padding:14px 28px;
  border-bottom:1px solid var(--line);
  background:rgba(10,9,6,.94);
  backdrop-filter:blur(8px)
}

.top-mark{
  font-weight:800;
  letter-spacing:.08em;
  font-size:13px
}

.top-mark span{
  color:var(--gold)
}

.topbar nav{
  display:flex;
  gap:22px
}

.topbar nav a{
  font-size:11px;
  letter-spacing:.12em;
  color:var(--muted)
}

.topbar nav a:hover{
  color:var(--gold)
}

.top-right{
  font-size:11px;
  letter-spacing:.12em;
  color:var(--gold)
}

main{
  max-width:1180px;
  margin:0 auto;
  padding:0 28px
}

.hero{
  padding:58px 0 36px;
  border-bottom:1px solid var(--line)
}

.hero-eyebrow{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:11px;
  letter-spacing:.18em;
  color:var(--muted)
}

.dot{
  width:8px;
  height:8px;
  background:var(--gold);
  border-radius:50%;
  box-shadow:0 0 0 5px rgba(230,194,90,.13)
}

.rule{
  height:1px;
  background:var(--line);
  flex:1
}

.hero h1{
  font-size:clamp(56px,10vw,138px);
  line-height:.86;
  letter-spacing:-.07em;
  margin:28px 0 20px;
  font-weight:900
}

.hero h1 span{
  color:var(--gold);
  font-weight:400
}

.equation{
  display:flex;
  flex-wrap:wrap;
  align-items:baseline;
  gap:18px 34px;
  padding:18px 0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line)
}

.equation strong{
  font-size:22px;
  letter-spacing:.02em
}

.equation i{
  font-style:normal;
  color:var(--gold);
  font-size:22px
}

.equation b{
  margin-left:auto;
  font-size:22px;
  border:1px solid var(--gold);
  padding:6px 12px;
  color:var(--gold)
}

.subline{
  font-size:clamp(16px,2.4vw,24px);
  line-height:1.5;
  margin:22px 0
}

.subline span{
  color:var(--gold);
  border-bottom:1px solid var(--line2);
  padding:0 2px
}

.hero-meta{
  display:flex;
  flex-wrap:wrap;
  gap:24px;
  color:var(--muted);
  font-size:11px;
  letter-spacing:.1em
}

.hero-meta span{
  display:flex;
  align-items:center;
  gap:7px
}

.hero-meta .gold{
  color:var(--gold)
}

.hero-strip{
  margin-top:30px;
  display:flex;
  overflow-x:clip
}

.hero-strip span{
  flex:1;
  text-align:center;
  padding:12px 4px;
  border:1px solid var(--line);
  border-left:0;
  color:var(--muted);
  font-size:12px;
  letter-spacing:.15em
}

.hero-strip span:first-child{
  border-left:1px solid var(--line)
}

.hero-strip span:nth-child(5){
  background:var(--gold);
  color:#111;
  font-weight:900
}

.section{
  padding:52px 0;
  border-bottom:1px solid var(--line)
}

.sec-head{
  display:flex;
  gap:20px;
  align-items:flex-start;
  margin-bottom:30px
}

.sec-num{
  font-size:12px;
  color:var(--gold);
  border:1px solid var(--gold);
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  flex:0 0 auto
}

.sec-head h2{
  font-size:clamp(28px,4vw,44px);
  line-height:1;
  margin:8px 0 0;
  letter-spacing:-.03em
}

.kicker{
  font-size:11px;
  letter-spacing:.2em;
  color:var(--gold);
  margin:4px 0
}

.sec-note{
  margin-left:auto;
  text-align:right;
  color:var(--muted);
  font-size:12px;
  line-height:1.6
}

.file-grid{
  display:grid;
  grid-template-columns:1.2fr 1.2fr .9fr;
  gap:1px;
  background:var(--line);
  border:1px solid var(--line)
}

.file-col{
  background:var(--surface);
  padding:20px
}

.col-head{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  padding-bottom:12px;
  margin-bottom:12px;
  font-size:11px;
  letter-spacing:.14em
}

.col-head b{
  color:var(--gold)
}

.file-col ul{
  list-style:none;
  margin:0;
  padding:0
}

.file-col li{
  display:flex;
  align-items:center;
  gap:9px;
  padding:6px 0;
  font-size:12.5px;
  color:#ddd5ba;
  word-break:break-all
}

.file-dot{
  width:4px;
  height:4px;
  background:var(--gold2);
  flex:0 0 auto
}

.netload{
  background:#171306
}

.net-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:10px 0;
  border-bottom:1px solid var(--line);
  font-size:12px
}

.net-row small{
  color:var(--muted)
}

.net-row strong{
  text-align:right
}

.mono-gold{
  color:var(--gold)
}

.net-note{
  font-size:12px;
  line-height:1.6;
  color:var(--muted);
  margin:14px 0
}

.stamp{
  display:flex;
  gap:8px;
  align-items:center;
  color:var(--gold);
  font-size:11px;
  letter-spacing:.12em;
  border:1px dashed var(--gold2);
  padding:10px
}

.missing{
  margin-top:16px;
  background:var(--gold);
  color:#171304;
  display:flex;
  align-items:center;
  gap:16px;
  padding:16px 20px
}

.missing>span{
  font-weight:900;
  white-space:nowrap
}

.missing p{
  margin:0;
  font-size:14px;
  line-height:1.4
}

.missing p strong{
  font-weight:900
}

.missing svg{
  margin-left:auto;
  flex:0 0 auto
}

.form-list{
  border-top:1px solid var(--line)
}

.field-row{
  width:100%;
  display:grid;
  grid-template-columns:42px 74px 1fr 1.25fr 22px;
  align-items:center;
  gap:16px;
  text-align:left;
  background:transparent;
  color:var(--ink);
  border:0;
  border-bottom:1px solid var(--line);
  padding:18px 10px;
  cursor:pointer;
  transition:.18s
}

.field-row:hover{
  background:var(--surface2)
}

.field-row.active{
  background:var(--surface2);
  box-shadow:inset 3px 0 0 var(--gold)
}

.field-row .idx{
  color:var(--muted);
  font-size:11px
}

.glyph{
  color:var(--gold);
  font-size:24px;
  font-weight:900
}

.field-main{
  display:flex;
  flex-direction:column;
  gap:4px
}

.field-main strong{
  font-size:16px
}

.field-main span{
  color:var(--muted);
  font-size:12px
}

.field-rule{
  font-size:12px;
  line-height:1.5;
  color:#ddd5ba;
  text-align:right
}

.field-detail{
  margin-top:18px;
  display:grid;
  grid-template-columns:120px 1fr;
  gap:20px;
  background:var(--surface);
  border:1px solid var(--line2);
  padding:22px
}

.detail-tag{
  align-self:start;
  color:#111;
  background:var(--gold);
  font-size:11px;
  letter-spacing:.14em;
  font-weight:900;
  padding:7px 10px;
  text-align:center
}

.field-detail p{
  margin:0;
  line-height:1.7;
  font-size:14px;
  color:#d8d0b8
}

.field-detail p strong{
  color:var(--ink)
}

.detail-foot{
  grid-column:2;
  display:flex;
  justify-content:space-between;
  color:var(--gold);
  font-size:11px;
  letter-spacing:.1em;
  border-top:1px solid var(--line);
  padding-top:12px
}

.mini-diagram{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1px;
  background:var(--line);
  border:1px solid var(--line);
  margin-top:18px
}

.d-cell{
  background:var(--bg);
  min-height:88px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:7px;
  text-align:center;
  font-size:11px;
  line-height:1.4;
  color:var(--muted)
}

.d-cell svg{
  color:var(--gold)
}

.d-cell.center{
  background:var(--gold);
  color:#111
}

.d-cell.center span{
  font-size:28px;
  font-weight:900
}

.d-cell.center small{
  letter-spacing:.2em
}

.d-cell.cross{
  font-size:34px;
  color:var(--gold)
}

.measure-hero{
  display:grid;
  grid-template-columns:1.2fr .8fr 1fr;
  background:var(--surface);
  border:1px solid var(--line)
}

.measure-hero>div{
  padding:26px;
  border-right:1px solid var(--line)
}

.measure-hero>div:last-child{
  border:0
}

.measure-hero small{
  display:block;
  color:var(--muted);
  letter-spacing:.16em;
  font-size:11px;
  margin-bottom:10px
}

.measure-hero strong{
  display:block;
  font-size:clamp(28px,4vw,42px);
  line-height:1
}

.measure-hero span{
  color:var(--muted);
  font-size:12px
}

.measure-hero .not{
  background:#1d120e
}

.measure-hero .not span{
  color:#d98a6d
}

.measure-hero .not strong{
  color:#e07a5a;
  text-decoration:line-through;
  text-decoration-color:#e07a5a
}

.calc-box{
  margin-top:18px;
  border:1px solid var(--line);
  padding:22px;
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:18px;
  align-items:center
}

.calc-line{
  display:flex;
  justify-content:space-between;
  gap:12px;
  border-bottom:1px solid var(--line);
  padding-bottom:8px
}

.calc-line b{
  color:var(--gold)
}

.calc-btn{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--gold);
  color:#111;
  border:0;
  padding:11px 14px;
  font-weight:800;
  cursor:pointer
}

.calc-btn:hover{
  background:#f2d67a
}

.calc-proof{
  grid-column:1/-1;
  border-top:1px dashed var(--line2);
  padding-top:14px;
  display:flex;
  flex-wrap:wrap;
  gap:8px 28px
}

.calc-proof p{
  margin:0;
  font-size:12px;
  color:var(--muted)
}

.calc-proof strong{
  color:var(--gold)
}

.mystery{
  margin-top:18px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  background:var(--surface2);
  border:1px solid var(--line2);
  padding:22px;
  gap:18px;
  align-items:center
}

.mystery small{
  display:block;
  color:var(--muted);
  letter-spacing:.16em;
  font-size:11px;
  margin-bottom:6px
}

.mystery strong{
  font-size:22px
}

.mystery strong span{
  color:var(--gold)
}

.mystery-state{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--gold);
  color:#111;
  padding:10px 14px;
  font-weight:900;
  font-size:12px;
  letter-spacing:.12em
}

.mystery p{
  grid-column:1/-1;
  margin:0;
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
  border-top:1px solid var(--line);
  padding-top:12px
}

footer{
  max-width:1180px;
  margin:0 auto;
  padding:44px 28px 36px
}

.foot-big{
  font-size:clamp(38px,6vw,72px);
  font-weight:900;
  letter-spacing:-.05em;
  line-height:1
}

.foot-big span{
  color:var(--gold);
  font-weight:300
}

.foot-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  margin:28px 0
}

.foot-grid>div{
  padding:18px 0;
  border-right:1px solid var(--line)
}

.foot-grid>div:last-child{
  border:0
}

.foot-grid small{
  display:block;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.18em;
  margin-bottom:7px
}

.foot-grid strong{
  font-size:13px
}

.foot-small{
  color:var(--muted);
  font-size:11px;
  letter-spacing:.1em;
  margin:0
}

@media(max-width:700px){
  .topbar{
    padding:12px 16px
  }

  .topbar nav{
    display:none
  }

  .top-right{
    display:none
  }

  main{
    padding:0 16px
  }

  .hero{
    padding:40px 0 28px
  }

  .equation b{
    margin-left:0
  }

  .hero-meta{
    gap:12px
  }

  .sec-head{
    flex-wrap:wrap
  }

  .sec-note{
    margin-left:0;
    text-align:left;
    width:100%
  }

  .file-grid{
    grid-template-columns:1fr
  }

  .missing{
    align-items:flex-start;
    flex-wrap:wrap
  }

  .missing svg{
    display:none
  }

  .field-row{
    grid-template-columns:30px 58px 1fr 20px;
    padding:16px 6px
  }

  .field-rule{
    display:none
  }

  .glyph{
    font-size:19px
  }

  .field-detail{
    grid-template-columns:1fr
  }

  .detail-foot{
    grid-column:1;
    flex-wrap:wrap;
    gap:8px
  }

  .measure-hero{
    grid-template-columns:1fr
  }

  .measure-hero>div{
    border-right:0;
    border-bottom:1px solid var(--line)
  }

  .calc-box{
    grid-template-columns:1fr
  }

  .calc-btn{
    justify-content:center
  }

  .mystery{
    grid-template-columns:1fr
  }

  .foot-grid{
    grid-template-columns:1fr 1fr
  }

  .foot-grid>div{
    padding:14px 10px 14px 0
  }

  footer{
    padding:36px 16px 28px
  }
}

@media(max-width:390px){
  .hero h1{
    font-size:52px
  }

  .hero-strip span{
    font-size:10px;
    padding:10px 2px
  }

  .field-row{
    grid-template-columns:24px 50px 1fr 16px
  }

  .foot-grid{
    grid-template-columns:1fr
  }
}
</style>
