  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.filter {
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.transition-all {
  transition-property: all;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.duration-700 {
  transition-duration: 700ms;
}

:root{
  --bg:#050507;
  --surface:#0b0b12;
  --surface2:#111118;
  --line:#26261f;
  --gold:#ffd700;
  --cyan:#00ccff;
  --lime:#39ff88;
  --pink:#ff3b82;
  --purple:#b388ff;
  --text:#f5f0dc;
  --muted:#9a9584;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace
}

a{
  color:inherit
}

::-moz-selection{
  background:var(--gold);
  color:#000
}

::selection{
  background:var(--gold);
  color:#000
}

.kritzel{
  transition:all .75s cubic-bezier(.2,.9,.25,1.2)
}

.dot{
  transition:all .45s ease
}

.ring-cell{
  transition:all .6s ease
}

@keyframes pulseGold{
  0%,100%{
    box-shadow:0 0 0 0 rgba(255,215,0,.45)
  }

  50%{
    box-shadow:0 0 0 14px rgba(255,215,0,0)
  }
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-6px)
  }
}

@keyframes spinSlow{
  to{
    transform:rotate(360deg)
  }
}

@keyframes blink{
  0%,100%{
    opacity:1
  }

  50%{
    opacity:.25
  }
}

.blink{
  animation:blink 1.1s infinite
}

.floaty{
  animation:floaty 3.2s ease-in-out infinite
}

.hover\:opacity-70:hover {
  opacity: 0.7;
}

@media (min-width: 640px) {
  .sm\:inline {
    display: inline;
  }

  .sm\:h-11 {
    height: 2.75rem;
  }

  .sm\:h-\[92px\] {
    height: 92px;
  }

  .sm\:w-11 {
    width: 2.75rem;
  }

  .sm\:w-\[92px\] {
    width: 92px;
  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .sm\:gap-4 {
    gap: 1rem;
  }

  .sm\:p-5 {
    padding: 1.25rem;
  }

  .sm\:p-6 {
    padding: 1.5rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:pt-10 {
    padding-top: 2.5rem;
  }

  .sm\:text-\[11px\] {
    font-size: 11px;
  }

  .sm\:text-\[12px\] {
    font-size: 12px;
  }

  .sm\:text-\[16px\] {
    font-size: 16px;
  }

  .sm\:text-\[18px\] {
    font-size: 18px;
  }

  .sm\:text-\[30px\] {
    font-size: 30px;
  }

  .sm\:text-\[38px\] {
    font-size: 38px;
  }

  .sm\:text-\[42px\] {
    font-size: 42px;
  }

  .sm\:text-\[44px\] {
    font-size: 44px;
  }

  .sm\:text-\[68px\] {
    font-size: 68px;
  }
}

@media (min-width: 768px) {
  .md\:flex {
    display: flex;
  }

  .md\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1024px) {
  .lg\:inline {
    display: inline;
  }

  .lg\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[\.9fr_1\.1fr\] {
    grid-template-columns: .9fr 1.1fr;
  }

  .lg\:grid-cols-\[1\.35fr_\.65fr\] {
    grid-template-columns: 1.35fr .65fr;
  }

  .lg\:grid-cols-\[1fr_\.9fr\] {
    grid-template-columns: 1fr .9fr;
  }

  .lg\:text-\[86px\] {
    font-size: 86px;
  }
}
